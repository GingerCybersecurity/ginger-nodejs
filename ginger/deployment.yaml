disk:
  - type: 'raw'
    path: '../target/disk_deployment.raw'
    size_mib: 512
dirs:
  - path: '/usr/www'
    uid: 10
    permissions: 0o700
files:
  - source: 'init.yaml'
    destination: '/usr/etc/init.yaml'
    uid: 0
    permissions: 0o400
  - source: 'auditd.rules'
    destination: '/usr/etc/auditd/auditd.rules'
    uid: 1
    permissions: 0o400
  - source: 'log4rs.json'
    destination: '/usr/etc/auditd/log4rs.json'
    uid: 1
    permissions: 0o400
