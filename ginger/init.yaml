networking:
  source: config
  ipv4:
    ip: 192.168.42.100
    netmask: 255.255.255.0
    broadcast: 192.168.42.255
    gateway: 192.168.42.1
    dns:
    - 10.0.0.2
commands:
- executable: /sbin/auditctl
  command_type: setup
  current_dir: /
  args:
  - "-R"
  - "/usr/etc/auditd/auditd.rules"
  uid: 1
  gid: 1
- executable: /sbin/auditd
  command_type: setup
  current_dir: /
  args:
  - "-c"
  - "/usr/etc/auditd"
  uid: 1
  gid: 1
- executable: /sbin/measurerd
  command_type: service
  current_dir: /
  args: [--stdout]
  uid: 2
  gid: 2
- executable: '/sbin/node-server'
  command_type: target
  current_dir: /
  args: []
  uid: 10
  gid: 10
  allow_dynamic_code: true
